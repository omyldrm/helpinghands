<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <title th:text="#{events.title}">Overview of Events</title>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>

<div class="container my-4">
    <div class="row">
        <h1 th:text="#{events.title}">All Events</h1>
        <a th:href="@{/events/add}" th:text="#{events.button.add}">+ Add Event</a>
    </div>
    <main>
        <table class="table">
            <thead>
            <tr>
                <th th:text="#{events.table.id}">ID</th>
                <th th:text="#{events.table.title}">Title</th>
                <th th:text="#{events.table.date}">Date</th>
                <th th:text="#{events.table.location}">Location</th>
                <th th:text="#{events.table.category}">Category</th>
                <th th:text="#{events.table.status}">Status</th>
                <th th:text="#{events.table.maxVolunteers}">Max Volunteers</th>
                <th th:text="#{events.table.organization}">Organization</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="event : ${events}">
                <td th:text="${event.getId()}">1</td>
                <td th:text="${event.getTitle()}">Event Title</td>
                <td th:text="${event.getEventDate()}">2026-10-20</td>
                <td th:text="${event.getLocation()}">Location</td>
                <td th:text="${event.getCategory()}">CONCERT</td>
                <td th:text="${event.getStatus()}">PLANNED</td>
                <td th:text="${event.getMaxVolunteers()}">10</td>
                <td th:text="${event.getOrganization() != null ? event.getOrganization().getName() : #messages.msg('common.none')}">
                    Organization Name
                </td>
                <td>
                    <a th:href="@{/events/{id}(id=${event.getId()})}"
                       class="btn btn-sm btn-outline-secondary"
                       th:text="#{events.viewDetails}">View Details</a>
                </td>
            </tr>
            </tbody>
        </table>
        <p><span th:text="#{events.totalCount}">Total events:</span> <span th:text="${#lists.size(events)}">0</span></p>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
</body>
</html>
