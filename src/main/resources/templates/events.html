<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{events.title}">Overview of Events</title>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>

<h1 th:text="#{events.title}">All Events</h1>
<a th:href="@{/events/add}">+ Add Event</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th th:text="#{events.table.title}">Title</th>
        <th th:text="#{events.table.date}">Date</th>
        <th th:text="#{events.table.location}">Location</th>
        <th th:text="#{events.table.category}">Category</th>
        <th th:text="#{events.table.status}">Status</th>
        <th th:text="#{events.table.maxVolunteers}">Max Volunteers</th>
        <th th:text="#{events.table.organization}">Organization</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="event : ${events}">
        <td th:text="${event.getId()}">1</td>
        <td th:text="${event.getTitle()}">Event Title</td>
        <td th:text="${event.getEventDate()}">2026-10-20</td>
        <td th:text="${event.getLocation()}">Location</td>
        <td th:text="${event.getCategory()}">CONCERT</td>
        <td th:text="${event.getStatus()}">PLANNED</td>
        <td th:text="${event.getMaxVolunteers()}">10</td>
        <td th:text="${event.getOrganization() != null ? event.getOrganization().getName() : 'None'}">Organization Name</td>
    </tr>
    </tbody>
</table>
<p>Total events: <span th:text="${#lists.size(events)}">0</span></p>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
