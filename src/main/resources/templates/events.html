<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Events - Helping Hands</title>
</head>
<body>
<nav>
    <a th:href="@{/events}">Events</a>
    <a th:href="@{/organizations}">Organizations</a>
    <a th:href="@{/volunteers}">Volunteers</a>
</nav>

<h1>All Events</h1>
<a th:href="@{/events/add}">+ Add Event</a>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Date</th>
        <th>Location</th>
        <th>Category</th>
        <th>Status</th>
        <th>Max Volunteers</th>
        <th>Organization</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="event : ${events}">
        <td th:text="${[verdachte link verwijderd]}">1</td>
        <td th:text="${event.title}">Event Title</td>
        <td th:text="${event.eventDate}">2026-10-20</td>
        <td th:text="${event.location}">Location</td>
        <td th:text="${event.category}">CONCERT</td>
        <td th:text="${event.status}">PLANNED</td>
        <td th:text="${event.maxVolunteers}">10</td>
        <td th:text="${event.organization != null ? [verdachte link verwijderd] : 'None'}">Organization Name</td>
    </tr>
    </tbody>
</table>
</body>
</html>
