<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <title th:text="#{volunteers.title}">Overview of Volunteers</title>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<div class="container my-4">

    <main>
        <div class="row">
            <h1 th:text="#{volunteers.title}">All Volunteers</h1>
            <a th:href="@{/volunteers/add}" th:text="#{volunteers.button.add}">+ Add Volunteer</a>
        </div>
        <table class="table">
            <thead>
            <tr>
                <th th:text="#{volunteers.table.id}">ID</th>
                <th th:text="#{volunteers.table.avatar}">Avatar</th>
                <th th:text="#{volunteers.table.fullName}">Name</th>
                <th th:text="#{volunteers.table.email}">Email</th>
                <th th:text="#{volunteers.table.birthdate}">Birth Date</th>
                <th th:text="#{volunteers.table.student}">Student</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="volunteer : ${volunteers}">
                <td th:text="${volunteer.getId()}">1</td>
                <td><img th:if="${volunteer.getAvatarUrl() != null}" th:src="${volunteer.getAvatarUrl()}" th:alt="#{volunteers.table.avatar}" alt="Avatar"/>
                </td>
                <td th:text="${volunteer.getFullName()}">John Doe</td>
                <td th:text="${volunteer.getEmail()}">Email Address</td>
                <td th:text="${volunteer.getBirthDate()}">2000-01-01</td>
                <td th:text="${volunteer.isStudent() ? #messages.msg('common.yes') : #messages.msg('common.no')}">Yes</td>
            </tr>
            </tbody>
        </table>
        <p><span th:text="#{volunteers.totalCount}">Total volunteers:</span> <span th:text="${#lists.size(volunteers)}">0</span></p>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>
</body>
</html>
