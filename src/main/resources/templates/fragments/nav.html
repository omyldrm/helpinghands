<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Navbar fragment</title>
</head>
<body>

<nav th:fragment="navbar" class="navbar border-bottom">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}" th:text="#{nav.brand}">Helping Hands</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" th:href="@{/events}" th:text="#{nav.events}">Events</a>
            <a class="nav-link" th:href="@{/organizations}" th:text="#{nav.organizations}">Organizations</a>
            <a class="nav-link" th:href="@{/volunteers}" th:text="#{nav.volunteers}">Volunteers</a>
            <a class="nav-link" th:href="@{/history}" th:text="#{nav.history}">Session History</a>
        </div>
        <div class="navbar-nav flex-row gap-2">
            <a class="nav-link" th:href="@{/(lang=en)}">EN</a>
            <a class="nav-link" th:href="@{/(lang=nl)}">NL</a>
            <a class="nav-link" th:href="@{/(lang=fr)}">FR</a>
            <a class="nav-link" th:href="@{/(lang=de)}">DE</a>
        </div>
    </div>
</nav>

</body>
</html>
