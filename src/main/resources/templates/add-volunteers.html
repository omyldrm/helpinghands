<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <title th:text="#{add-volunteers.title}">Add New Volunteer</title>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>
<div class="container my-4">
    <main>
        <div class="row">
            <h1 th:text="#{add-volunteers.title}">Add New Volunteer</h1>
        </div>

        <form class="col-lg-6" th:action="@{/volunteers/add}" th:object="${volunteerForm}" method="post" novalidate>
            <div class="alert alert-danger" th:if="${#fields.hasErrors('*')}" th:text="#{add-events.globalError}">
                Please fix the errors below before submitting the form.
            </div>

            <div class="mb-3">
                <label for="firstName" class="form-label" th:text="#{add-volunteers.form.firstName}">First Name:</label>
                <input type="text" id="firstName" class="form-control" th:field="*{firstName}" th:errorclass="is-invalid"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}">First name error</div>
            </div>

            <div class="mb-3">
                <label for="lastName" class="form-label" th:text="#{add-volunteers.form.lastName}">Last Name:</label>
                <input type="text" id="lastName" class="form-control" th:field="*{lastName}" th:errorclass="is-invalid"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}">Last name error</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label" th:text="#{add-volunteers.form.email}">Email Address:</label>
                <input type="email" id="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{add-volunteers.button.submit}">Save Volunteer</button>
        </form>
        <footer th:replace="~{fragments/footer :: footer}"></footer>
    </main>
</div>
</body>
</html>
