<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Volunteer - Helping Hands</title>
</head>
<body>
<nav>
    <a th:href="@{/events}">Events</a>
    <a th:href="@{/organizations}">Organizations</a>
    <a th:href="@{/volunteers}">Volunteers</a>
</nav>

<h1>Add New Volunteer</h1>

<form th:action="@{/volunteers/add}" th:object="${volunteerForm}" method="post">
    <div>
        <label for="firstName">First Name:</label>
        <input type="text" id="firstName" th:field="*{firstName}" required />
    </div>

    <div>
        <label for="lastName">Last Name:</label>
        <input type="text" id="lastName" th:field="*{lastName}" required />
    </div>

    <div>
        <label for="email">Email Address:</label>
        <input type="email" id="email" th:field="*{email}" required />
    </div>

    <div>
        <label for="birthDate">Birth Date:</label>
        <input type="date" id="birthDate" th:field="*{birthDate}" required />
    </div>

    <div>
        <label>
            <input type="checkbox" th:field="*{student}" />
            Is Student
        </label>
    </div>

    <div>
        <label for="avatarUrl">Avatar URL:</label>
        <input type="url" id="avatarUrl" th:field="*{avatarUrl}" />
    </div>

    <button type="submit">Save Volunteer</button>
</form>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
