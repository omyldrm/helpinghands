<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Event - Helping Hands</title>
</head>
<body>
<nav>
    <a th:href="@{/events}">Events</a>
    <a th:href="@{/organizations}">Organizations</a>
    <a th:href="@{/volunteers}">Volunteers</a>
</nav>

<h1>Add New Event</h1>

<form th:action="@{/events/add}" th:object="${eventForm}" method="post">
    <div>
        <label for="title">Title:</label>
        <input type="text" id="title" th:field="*{title}" required />
    </div>

    <div>
        <label for="eventDate">Event Date:</label>
        <input type="date" id="eventDate" th:field="*{eventDate}" required />
    </div>

    <div>
        <label for="location">Location:</label>
        <input type="text" id="location" th:field="*{location}" required />
    </div>

    <div>
        <label for="maxVolunteers">Max Volunteers:</label>
        <input type="number" id="maxVolunteers" th:field="*{maxVolunteers}" required min="1" />
    </div>

    <div>
        <label for="category">Category:</label>
        <select id="category" th:field="*{category}">
            <option th:each="cat : ${T(be.kdg.pro3.helpinghands.domain.EventCategory).values()}"
                    th:value="${cat}" th:text="${cat}"></option>
        </select>
    </div>

    <div>
        <label for="status">Status:</label>
        <select id="status" th:field="*{status}">
            <option th:each="st : ${T(be.kdg.pro3.helpinghands.domain.Status).values()}"
                    th:value="${st}" th:text="${st}"></option>
        </select>
    </div>

    <div>
        <label for="organizationId">Organization:</label>
        <select id="organizationId" th:field="*{organizationId}">
            <option th:each="org : ${organizations}"
                    th:value="${org.getId()}" th:text="${org.getName()}"></option>
        </select>
    </div>

    <div>
        <label for="bannerUrl">Banner URL:</label>
        <input type="text" id="bannerUrl" th:field="*{bannerUrl}" />
    </div>

    <button type="submit">Save Event</button>
</form>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
