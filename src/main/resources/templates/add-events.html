<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <title th:text="#{add-events.title}">Add New Event</title>
</head>
<body>
<nav th:replace="~{fragments/nav :: navbar}"></nav>

<h1 th:text="#{add-events.title}">Add New Event</h1>

<form th:action="@{/events/add}" th:object="${eventForm}" method="post">
    <div>
        <label for="title" th:text="#{add-events.form.title}">Title:</label>
        <input type="text" id="title" th:field="*{title}" required />
    </div>

    <div>
        <label for="eventDate" th:text="#{add-events.form.date}">Event Date:</label>
        <input type="date" id="eventDate" th:field="*{eventDate}" required />
    </div>

    <div>
        <label for="location" th:text="#{add-events.form.location}">Location:</label>
        <input type="text" id="location" th:field="*{location}" required />
    </div>

    <div>
        <label for="maxVolunteers" th:text="#{add-events.form.maxVolunteers}">Max Volunteers:</label>
        <input type="number" id="maxVolunteers" th:field="*{maxVolunteers}" required min="1" />
    </div>

    <div>
        <label for="category" th:text="#{add-events.form.category}">Category:</label>
        <select id="category" th:field="*{category}">
            <option th:each="cat : ${T(be.kdg.pro3.helpinghands.domain.EventCategory).values()}"
                    th:value="${cat}" th:text="${cat}"></option>
        </select>
    </div>

    <div>
        <label for="status" th:text="#{add-events.form.status}">Status:</label>
        <select id="status" th:field="*{status}">
            <option th:each="st : ${T(be.kdg.pro3.helpinghands.domain.Status).values()}"
                    th:value="${st}" th:text="${st}"></option>
        </select>
    </div>

    <div>
        <label for="organizationId" th:text="#{add-events.form.organization}">Organization:</label>
        <select id="organizationId" th:field="*{organizationId}">
            <option th:each="org : ${organizations}"
                    th:value="${org.getId()}" th:text="${org.getName()}"></option>
        </select>
    </div>

    <div>
        <label for="bannerUrl" th:text="#{add-events.form.bannerUrl}">Banner URL:</label>
        <input type="text" id="bannerUrl" th:field="*{bannerUrl}" />
    </div>

    <button type="submit" th:text="#{add-events.button.submit}">Save Event</button>
</form>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
