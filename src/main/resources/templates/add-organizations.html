<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Organization - Helping Hands</title>
</head>
<body>
<nav>
    <a th:href="@{/events}">Events</a>
    <a th:href="@{/organizations}">Organizations</a>
    <a th:href="@{/volunteers}">Volunteers</a>
</nav>

<h1>Add New Organization</h1>

<form th:action="@{/organizations/add}" th:object="${organizationForm}" method="post">
    <div>
        <label for="name">Name:</label>
        <input type="text" id="name" th:field="*{name}" required />
    </div>

    <div>
        <label for="foundedDate">Founded Date:</label>
        <input type="date" id="foundedDate" th:field="*{foundedDate}" required />
    </div>

    <div>
        <label for="averageRating">Average Rating (0.0 - 5.0):</label>
        <input type="number" id="averageRating" step="0.1" min="0" max="5" th:field="*{averageRating}" required />
    </div>

    <div>
        <label>
            <input type="checkbox" th:field="*{verified}" />
            Is Verified
        </label>
    </div>

    <div>
        <label for="logoUrl">Logo URL:</label>
        <input type="url" id="logoUrl" th:field="*{logoUrl}" />
    </div>

    <button type="submit">Save Organization</button>
</form>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
