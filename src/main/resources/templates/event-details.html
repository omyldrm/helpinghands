<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <script defer th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <title>Event details</title>
</head>
<body>
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container my-4">
    <main>
        <a th:href="@{/events}" class="btn btn-outline-secondary mb-3">
            &larr; <span th:text="#{event.details.back}">Back to Overview</span>
        </a>

        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="card-title mb-3" th:text="${event.title}">Event Name</h1>

                <p class="card-text">
                    <strong><span th:text="#{events.table.date}">Date</span>:</strong>
                    <span th:text="${event.eventDate}">2026-10-20</span>
                </p>

                <p class="card-text">
                    <strong><span th:text="#{events.table.location}">Location</span>:</strong>
                    <span th:text="${event.location}">Location</span>
                </p>

                <p class="card-text" th:if="${event.category != null}">
                    <strong th:text="#{event.details.category}">Category:</strong>
                    <span class="badge bg-primary" th:text="${event.category}">CATEGORY</span>
                </p>

                <p class="card-text" th:if="${event.organization != null}">
                    <strong th:text="#{event.details.organization}">Organized by:</strong>
                    <span th:text="${event.organization.name}">Organization Name</span>
                </p>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
